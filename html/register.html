<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroPlay - Registro</title>
    <link rel="stylesheet" href="../css/register.css">
    <script src="../js/registro.js"></script>
</head>
<body>
    
    <div class="auth-container">
        <!-- Tarjeta de Autenticación -->
        <div class="auth-card">
            <div class="auth-header">
                    <span class="logo-icon">🕹️</span>
                    <span class="logo-text">Retro<span class="highlight">Play</span></span>
                </a>
                <h1>Crea tu cuenta</h1>
                <p>Únete a la comunidad retro y compite en el ranking</p>
            </div>

            <form class="auth-form" action="#" method="POST">
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" placeholder="PlayerOne" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="usuario@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="auth-btn">Registrarse</button>
            </form>

            <div class="auth-footer">
                <p>¿Ya tienes una cuenta? <a href="index.html">Inicia sesión</a></p>
            </div>
        </div>
    </div>

</body>
</html>
